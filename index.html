<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f0e7" />
    <meta
      name="description"
      content="A multi-style generative voxel sculpture system whose tree, forest, mountain, station, house, castle, glyph, city, lighthouse, pagoda, temple or crystal becomes a real QR code when rotated."
    />
    <title>3D QR — Generative QR Sculptures</title>
    <style>
      .description-disclosure {
        margin: 0;
      }

      .description-disclosure > summary {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 14px;
        list-style: none;
        cursor: pointer;
        outline: none;
      }

      .description-disclosure > summary::-webkit-details-marker {
        display: none;
      }

      .description-disclosure > summary:focus-visible .description-toggle {
        outline: 1px solid currentColor;
        outline-offset: 3px;
      }

      .description-disclosure .eyebrow {
        display: none;
      }

      .control-copy-heading {
        display: block;
        margin: 0;
        font-size: clamp(34px, 4.4vw, 52px);
        line-height: .94;
        letter-spacing: -.05em;
        font-weight: 590;
      }

      .description-toggle {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin-top: 1px;
        border: 1px solid rgba(32, 35, 31, .22);
        color: rgba(32, 35, 31, .64);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 15px;
        font-weight: 500;
        line-height: 1;
        transition: border-color 160ms ease, color 160ms ease, transform 220ms ease;
      }

      .description-disclosure > summary:hover .description-toggle {
        border-color: rgba(32, 35, 31, .58);
        color: var(--ink);
      }

      .description-toggle::before {
        content: '+';
      }

      .description-disclosure[open] .description-toggle::before {
        content: '−';
      }

      .description-body {
        display: grid;
        grid-template-rows: 0fr;
        opacity: 0;
        transition: grid-template-rows 260ms cubic-bezier(.22, .72, .22, 1), opacity 180ms ease;
      }

      .description-disclosure[open] .description-body {
        grid-template-rows: 1fr;
        opacity: 1;
      }

      .description-body-inner {
        min-height: 0;
        overflow: hidden;
      }

      .control-copy .description-disclosure .lede {
        display: block;
        max-width: 39rem;
        margin: 11px 42px 0 0;
        color: rgba(32, 35, 31, .58);
        font-size: 11px;
        line-height: 1.55;
      }

      .control-panel .style-row .style-chip {
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .masthead {
        transition: opacity 220ms ease, transform 260ms cubic-bezier(.22, .72, .22, 1);
      }

      body[data-controls='collapsed'] .masthead {
        opacity: 0;
        transform: translateY(-8px);
        pointer-events: none;
      }

      .control-panel:has(.description-disclosure:not([open])) {
        left: 28px;
        right: auto;
        bottom: 28px;
        width: 44px;
        height: 44px;
        padding: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      body[data-mode='qr'] .control-panel:has(.description-disclosure:not([open])) {
        background: transparent;
        box-shadow: none;
      }

      .control-panel:has(.description-disclosure:not([open])) > :not(.control-copy) {
        display: none;
      }

      .control-panel:has(.description-disclosure:not([open])) .control-copy,
      .description-disclosure:not([open]),
      .description-disclosure:not([open]) > summary {
        width: 44px;
        height: 44px;
      }

      .description-disclosure:not([open]) > summary {
        display: grid;
        grid-template-columns: 1fr;
        place-items: center;
        gap: 0;
        background: color-mix(in srgb, var(--paper-clean) 90%, transparent);
        box-shadow: 0 10px 28px rgba(32, 35, 31, .09);
        backdrop-filter: blur(14px) saturate(.9);
        -webkit-backdrop-filter: blur(14px) saturate(.9);
      }

      .description-disclosure:not([open]) > summary > span:first-child {
        display: none;
      }

      .description-disclosure:not([open]) .description-toggle {
        width: 44px;
        height: 44px;
        margin: 0;
        border-color: rgba(32, 35, 31, .28);
        color: rgba(32, 35, 31, .72);
        background: transparent;
      }

      .control-panel .panel-footer {
        grid-template-columns: minmax(0, 1fr);
      }

      .panel-footer .sr-status {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        border: 0;
        white-space: nowrap;
      }

      @media (max-width: 760px) {
        .control-copy-heading {
          max-width: 100%;
          font-size: clamp(27px, 9vw, 34px);
          line-height: .96;
        }

        .description-toggle {
          width: 30px;
          height: 30px;
        }

        .control-copy .description-disclosure .lede {
          margin-top: 9px;
          margin-right: 38px;
          font-size: 10px;
          line-height: 1.5;
        }

        .control-panel .style-row .style-chip {
          min-height: 38px;
        }

        .control-panel:has(.description-disclosure:not([open])) {
          left: 12px;
          right: auto;
          bottom: max(12px, env(safe-area-inset-bottom));
          width: 48px;
          height: 48px;
          padding: 0;
        }

        .control-panel:has(.description-disclosure:not([open])) .control-copy,
        .description-disclosure:not([open]),
        .description-disclosure:not([open]) > summary,
        .description-disclosure:not([open]) .description-toggle {
          width: 48px;
          height: 48px;
        }
      }

      @media (max-width: 420px) {
        .control-copy-heading {
          font-size: clamp(25px, 8.5vw, 30px);
        }
      }

      @media (max-height: 600px) and (min-width: 600px) {
        .control-copy-heading {
          font-size: 28px;
          line-height: .95;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .description-body,
        .description-toggle,
        .masthead {
          transition: none;
        }
      }
    </style>
  </head>
  <body data-mode="art" data-style="tree" data-controls="expanded">
    <main class="app-shell">
      <section class="stage" id="stage" aria-label="Interactive voxel QR sculpture"></section>

      <header class="masthead">
        <a class="brand" href="#" aria-label="3D QR home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>3D / QR</span>
        </a>
        <div class="header-actions">
          <a class="source-link" href="https://github.com/JULESlois/3D-QR" target="_blank" rel="noreferrer">SOURCE ↗</a>
          <span id="mode-readout" hidden></span>
        </div>
      </header>

      <section class="control-panel" aria-label="QR controls">
        <div class="control-copy">
          <details class="description-disclosure" open>
            <summary aria-label="Hide QR controls for immersive view">
              <span>
                <span class="eyebrow" id="style-eyebrow">VOXEL QR SCULPTURE / TREE</span>
                <span class="control-copy-heading" id="style-headline" role="heading" aria-level="1">Grow the code.</span>
              </span>
              <span class="description-toggle" aria-hidden="true"></span>
            </summary>
            <div class="description-body">
              <div class="description-body-inner">
                <p class="lede" id="style-lede">
                  A QR-constrained canopy rises from dark modules while the ground keeps the rest of the symbol intact. Rotate the same voxel field into its scanner view.
                </p>
              </div>
            </div>
          </details>
        </div>

        <label class="url-field" for="qr-input">
          <span>URL OR TEXT</span>
          <input
            id="qr-input"
            type="text"
            inputmode="url"
            autocomplete="off"
            spellcheck="false"
            value="https://github.com/JULESlois/3D-QR"
            aria-describedby="qr-meta"
          />
        </label>

        <div class="style-control">
          <span class="palette-label">SCENE</span>
          <div class="style-row" aria-label="Sculpture style">
            <button class="style-chip is-active" type="button" data-style="tree">TREE</button>
            <button class="style-chip" type="button" data-style="forest">FOREST</button>
            <button class="style-chip" type="button" data-style="mountain">MOUNTAIN</button>
            <button class="style-chip" type="button" data-style="station">STATION</button>
            <button class="style-chip" type="button" data-style="house">HOUSE</button>
            <button class="style-chip" type="button" data-style="castle">CASTLE</button>
            <button class="style-chip" type="button" data-style="glyph">GLYPH</button>
            <button class="style-chip" type="button" data-style="city">CITY</button>
            <button class="style-chip" type="button" data-style="lighthouse">LIGHTHOUSE</button>
            <button class="style-chip" type="button" data-style="pagoda">PAGODA</button>
            <button class="style-chip" type="button" data-style="temple">TEMPLE</button>
            <button class="style-chip" type="button" data-style="crystal">CRYSTAL</button>
          </div>
        </div>

        <div class="palette-control">
          <span class="palette-label">PALETTE</span>
          <div class="palette-row" aria-label="Sculpture palette">
            <button class="palette-swatch is-active" type="button" data-palette="blossom" aria-label="Blossom palette"></button>
            <button class="palette-swatch" type="button" data-palette="summer" aria-label="Summer palette"></button>
            <button class="palette-swatch" type="button" data-palette="ginkgo" aria-label="Ginkgo palette"></button>
            <button class="palette-swatch" type="button" data-palette="spectrum" aria-label="Spectrum palette"></button>
          </div>
        </div>

        <div class="panel-footer">
          <p id="qr-meta" class="sr-status" role="status" aria-live="polite"></p>
          <button id="mode-toggle" class="mode-toggle" type="button" aria-pressed="false">
            <span id="mode-toggle-label">VIEW QR</span>
            <span class="toggle-glyph" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>

      <span id="style-specimen" hidden></span>
      <span id="stage-hint" hidden></span>
    </main>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/ui-controls.ts"></script>
    <script type="module" src="/src/scene-picker.ts"></script>
  </body>
</html>
