name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

      - name: Browser viewport smoke
        run: node scripts/browser-smoke.mjs

      - name: PNG export browser smoke
        run: node scripts/png-export-smoke.mjs

      - name: GIF export browser smoke
        run: node scripts/gif-export-browser-smoke.mjs

      - name: Upload browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: browser-smoke/*.png
          if-no-files-found: warn

      - name: Upload PNG export smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: png-export-smoke
          path: png-export-smoke/*.png
          if-no-files-found: warn

      - name: Upload GIF export smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gif-export-smoke
          path: gif-export-smoke/*.gif
          if-no-files-found: warn

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
